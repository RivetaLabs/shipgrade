[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shipgrade"
version = "0.1.0"
description = "Grade your LLM feature before you ship: a plain-English, severity-ranked A-to-F safety and regulated-domain compliance report card."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
keywords = [
    "llm-security",
    "ai-security",
    "prompt-injection",
    "system-prompt-leakage",
    "owasp-llm",
    "ai-compliance",
    "llm-evaluation",
    "sarif",
    "ai-safety",
    "regulated-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
authors = [{ name = "Jacob Dennis" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "anthropic>=0.105.2",
    "openai>=2.39.0",
]

[project.scripts]
shipgrade = "shipgrade.cli:main"

[project.urls]
Documentation = "https://github.com/RivetaLabs/Shipgrade#readme"
Source = "https://github.com/RivetaLabs/Shipgrade"
Issues = "https://github.com/RivetaLabs/Shipgrade/issues"
Security = "https://github.com/RivetaLabs/Shipgrade/blob/main/SECURITY.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "pyright>=1.1.380",
    "syrupy>=4.6.0",
    "jsonschema>=4.21.0",
    "respx>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shipgrade"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer's Option/Argument are sentinel markers evaluated once at import, not mutable
# defaults. This is the documented Typer/FastAPI fix for B008: without it, every Path- or
# list-typed option is flagged while bool/str/int ones slip through (B008 skips defaults
# annotated with immutable builtins), which would force a noqa on most CLI options.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
