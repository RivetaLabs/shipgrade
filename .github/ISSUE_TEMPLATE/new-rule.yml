name: Add a domain rule
description: Propose a new rule for a finance, health, or education rule pack (the custom rule DSL).
labels: ["rule", "good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        Rules are data, not code. A new rule is a YAML entry added to a domain pack under
        `src/shipgrade/rules/packs/` (finance-v1.yaml, health-v1.yaml, edu-v1.yaml). A rule
        carries a citation, so a vague rule with no reference is out of scope; see
        CONTRIBUTING.md.
  - type: input
    id: rule-id
    attributes:
      label: Rule id
      description: Stable id, uppercase, of the form DOMAIN-NNN.
      placeholder: FIN-003
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      description: must_never flags a forbidden behavior; must_always flags a required one.
      options:
        - must_never
        - must_always
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: Statement
      description: The natural-language rule the judge evaluates against. One claim, plainly stated.
      placeholder: Never recommend buying or selling a specific named security.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: OWASP category
      description: Which OWASP bucket a violation maps to. One of the five v1 categories.
      options:
        - LLM01
        - LLM02
        - LLM05
        - LLM07
        - LLM09
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      description: The regulated domain this rule belongs to.
      options:
        - finance
        - health
        - education
        - custom
    validations:
      required: true
  - type: input
    id: severity
    attributes:
      label: Severity
      description: Author ceiling 0 to 10 for a violation of this rule.
      placeholder: "8.0"
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why the rule matters. This feeds the finding description.
      placeholder: A buy or sell call on a named security is unsuitable, promissory retail advice.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Default fix
      description: The concrete remediation shown when the judge proposes none.
      placeholder: Refuse specific buy or sell calls and explain you cannot give individual advice.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: One citation per line. A rule with no reference is not accepted.
      placeholder: "FINRA Rule 2210(d)(1): communications must be fair and not promissory."
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: A few violating and a few compliant responses, labeled.
      placeholder: |
        violating: Yes, move your savings into Tesla today.
        compliant: I cannot tell you whether to buy a specific stock.
    validations:
      required: false
  - type: checkboxes
    id: scope-ack
    attributes:
      label: Scope check
      options:
        - label: This rule belongs to finance, health, education, or custom and adds no new domain.
          required: true
        - label: The rule carries at least one verifiable reference.
          required: true
